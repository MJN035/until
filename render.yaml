# Until Cloud — Render 무료 티어 Blueprint
#
# ⚠ 코드 실행 러너(`until-runner`)는 **여기에 없다.** 일반 PaaS 컨테이너는 네트워크
#   송신을 막을 수 없어서, 러너를 올려도 자기 격리 검증을 통과하지 못하고 실행 요청을
#   전부 거절한다(그게 맞는 동작이다). 러너는 송신을 막을 수 있는 곳에 따로 띄우고
#   `UNTIL_RUNNER_URL`·`UNTIL_RUNNER_KEY`로 연결한다 —
#   `docs/planning/2026-08-21-web-execution-runner.md`와 `deploy/Dockerfile.runner` 참조.
#   두 값이 없으면 웹은 코드 실행 없이 지금까지와 똑같이 동작한다.
# 사용: render.com → New → Blueprint → 이 저장소 연결 → Apply.
# 시크릿 3개(sync: false)는 적용 시 대시보드가 입력을 요구한다.
# 참고: 무료 플랜은 15분 유휴 시 잠들고 첫 요청에 ~30초 콜드스타트.
#       사용자 데이터는 Cloudflare KV 미러로 재시작·슬립에도 유지된다.
services:
  - type: web
    name: until-app
    runtime: docker
    plan: free
    dockerfilePath: ./deploy/Dockerfile
    dockerContext: .
    healthCheckPath: /healthz
    autoDeploy: true          # main 푸시마다 자동 재배포
    envVars:
      - key: UNTIL_CLOUD
        value: "1"
      - key: UNTIL_BACKEND
        value: local
      # ── 주 제공자: Cerebras (2026-07-17 전환) ──
      # gpt-oss-120b = 프로덕션 안정 모델(종료일 없음), 120B·~3000 tok/s.
      # zai-glm-4.7(355B)는 품질 최상이나 2026-08-17 지원 종료 + 종료는 429가
      # 아니라 자동 폴백이 안 걸려 앱이 깨지므로 주 모델로 쓰지 않는다.
      - key: UNTIL_BASE_URL
        value: https://api.cerebras.ai/v1
      - key: UNTIL_MODEL
        value: gpt-oss-120b
      # 보조 패스(AI 제안·완성도 점검)는 UNTIL_MODEL_LIGHT를 두지 않는다 —
      # 이 값은 주 제공자(Cerebras) base로 나가는데, 기존 llama-3.1-8b-instant는
      # Groq 전용이라 Cerebras에서 깨진다. 미설정이면 보조도 gpt-oss-120b 사용.
      # ── 백업 제공자 사슬(429 소진 시 _2 → _3 → _4 순서로 자동 강등) ──
      # 무료 제공자·한도 목록 참고: https://github.com/cheahjs/free-llm-api-resources
      # base_url·model은 공개값. 각 제공자 키(_API_KEY_N)만 대시보드에 sync:false로 입력.
      # 키 없는 슬롯은 코드가 조용히 건너뛴다(부분 설정 허용) → 키 넣는 순간 활성.
      # _1차 백업: NVIDIA NIM — Kimi K2(moonshotai). ⚠ 중국계 모델이라 한자 누수 가능 →
      #   BoundaryValidator가 검출·reask로 방어하지만, 채택 전 한자 누수율 A/B 권장.
      - key: UNTIL_BASE_URL_2
        value: https://integrate.api.nvidia.com/v1
      - key: UNTIL_MODEL_2
        value: moonshotai/kimi-k2-instruct
      # _2차 백업: Google AI Studio(Gemini Flash, OpenAI 호환) — 큰 TPM·한국어 안정.
      - key: UNTIL_BASE_URL_3
        value: https://generativelanguage.googleapis.com/v1beta/openai
      - key: UNTIL_MODEL_3
        value: gemini-2.5-flash
      # _최후 백업: Groq(위 전부 소진 시). 70b → 8b 자동 강등(fallback_models 기본 사슬).
      - key: UNTIL_BASE_URL_4
        value: https://api.groq.com/openai/v1
      - key: UNTIL_MODEL_4
        value: llama-3.3-70b-versatile
      # ── 실제 제출(사용자 결정 2026-08-23) ──
      # 확인 화면의 클릭 한 번으로 eTL에 저장하고 채점 대기까지 확정한다
      # (`capture/sources/moodle_submit` — save_submission → submit_for_grading).
      # 이 값을 지우거나 "0"으로 두면 즉시 dry-run으로 돌아간다(코드 변경 불필요).
      #
      # 켜져 있어도 **자동으로 나가는 경로는 없다.** 한 건마다 4겹을 통과해야 한다 —
      # 사람이 확인 화면에서 누른 클릭 · 그 클릭에 결합된 1회용 nonce ·
      # 제출 게이트(plan.allowed) · 신뢰 호스트(myetl.snu.ac.kr).
      # 토큰은 그 사용자 자신의 것만 쓴다(운영자 토큰 폴백은 클라우드에서 차단).
      # 나간 요청은 전부 `_until_work/submit_audit.jsonl`에 남는다.
      - key: UNTIL_SUBMIT_ARMED
        value: "1"
      - key: UNTIL_GLOBAL_DAILY_DRAFTS
        value: "200"
      - key: UNTIL_FREE_DRAFTS
        value: "5"
      # 명시적 동의 뒤 공개 소개 화면의 PageView만 측정한다.
      - key: UNTIL_GA_MEASUREMENT_ID
        value: G-MJPDCEM6ZX
      - key: UNTIL_META_PIXEL_ID
        value: "1488269053055792"
      # Cloudflare KV 미러(식별자 — 비밀 아님. 쓰기 권한은 아래 토큰이 가짐)
      - key: UNTIL_KV_ACCOUNT
        value: 83c35f45d3f1d1a56282c31ecebdd2f2
      - key: UNTIL_KV_NAMESPACE
        value: 8d9c9612df0c4657a25f38fc335060af
      # ── 시크릿(대시보드에서 입력) ──
      - key: UNTIL_API_KEY      # 주 제공자 키 = Cerebras (cloud.cerebras.ai)
        sync: false
      - key: UNTIL_API_KEY_2    # _2 백업 키 = NVIDIA NIM (build.nvidia.com) — Kimi
        sync: false
      - key: UNTIL_API_KEY_3    # _3 백업 키 = Google AI Studio (aistudio.google.com)
        sync: false
      - key: UNTIL_API_KEY_4    # _4 백업 키 = Groq (console.groq.com) — 최후 폴백
        sync: false
      - key: UNTIL_KV_TOKEN     # Cloudflare API 토큰 (Workers KV Storage: Edit)
        sync: false
      - key: UNTIL_SESSION_KEY  # 세션 서명 키(32바이트+ 무작위, 절대 교체 금지)
        sync: false             # 미설정=재시작마다 랜덤 키 → KV 복원 세션 전부
                                # 서명 불일치로 유실(2026-08-05 실측). 필수.
      - key: UNTIL_BETA_CODE    # 초대 코드 (예: SNU-EARLY) — 비우면 게이트 없음
        sync: false
      # ── CSRF 안전밸브 ──
      # 상태 변경 POST는 Origin(없으면 Referer)이 요청 호스트와 같아야 통과한다.
      # 프록시가 Host를 바꿔 쓰는 배포에서 정상 요청이 막히면 아래로 즉시 푼다.
      #   UNTIL_CSRF_ORIGINS=alt.example.com   → 그 호스트도 신뢰
      #   UNTIL_CSRF_ENFORCE=0                 → 차단 끄고 경고 로그만(응급)
      # 막힐 뻔한 요청은 어느 쪽이든 WARNING으로 남으니 로그에서 확인할 것.
      # ── 구글 로그인(선택) ──
      # 둘 다 설정돼야 켜진다. 구글 클라우드 콘솔 → API 및 서비스 → 사용자 인증 정보
      # → OAuth 클라이언트 ID(웹 애플리케이션)를 만들고,
      # '승인된 리디렉션 URI'에 아래 UNTIL_GOOGLE_REDIRECT_URI 값을 그대로 등록한다.
      # 로그인하면 uid가 계정에 고정돼 기기·브라우저가 바뀌어도 과제가 따라온다.
      - key: UNTIL_GOOGLE_CLIENT_ID
        sync: false
      - key: UNTIL_GOOGLE_CLIENT_SECRET
        sync: false
      - key: UNTIL_GOOGLE_REDIRECT_URI
        value: https://until-app.onrender.com/auth/google/callback
      # ── 카카오 로그인(선택) ──
      # Kakao Developers → 카카오 로그인 → Redirect URI에 아래 값을 그대로 등록.
      # REST API 키와 Client Secret이 모두 설정될 때 로그인 화면에 버튼이 나타난다.
      - key: UNTIL_KAKAO_CLIENT_ID
        sync: false
      - key: UNTIL_KAKAO_CLIENT_SECRET
        sync: false
      - key: UNTIL_KAKAO_REDIRECT_URI
        value: https://until-app.onrender.com/auth/kakao/callback
      # 로그인 강제(기본 off) — "1"이면 초안 생성 전에 로그인이 필요하다.
      # 베타 초반에는 off 권장: 붙여넣고 초안까지 가 본 뒤 저장하려고 로그인하는
      # 흐름이 전환율에 낫다(로그인 순간 익명 작업이 계정으로 넘어간다).
      # - key: UNTIL_REQUIRE_LOGIN
      #   value: "1"
      # 학교 계정만 받고 싶을 때(선택): snu.ac.kr
      # - key: UNTIL_GOOGLE_ALLOWED_DOMAIN
      #   value: snu.ac.kr
      - key: UNTIL_ADMIN_KEY    # /admin 로그인 키(32바이트 이상 무작위 권장)
        sync: false
      # ⚠ UNTIL_CANVAS_TOKEN은 절대 추가 금지(운영자 eTL 계정 노출 — 코드도 차단함)
